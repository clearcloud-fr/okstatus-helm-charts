apiVersion: v2
name: private-agent
description: OKStatus private monitoring agent — runs inside your own cluster and monitors your private services. Outbound HTTPS only, no inbound port.
type: application
# 0.4.0 — removed the PVC entirely. Stateless credentials
# (credentials.agentId/agentSecret, or credentials.existingSecretName for a
# Secret you manage — e.g. External Secrets) are the primary path; legacy token
# mode now keeps its credential on an emptyDir (survives container restart, not
# a reschedule).
# 0.5.0 — appVersion moved to the first public agent release (1.0.0), the
# image ghcr.io/clearcloud-fr/okstatus-agent now actually publishes.
version: 0.5.0
# Stateless (credentials) mode needs an agent that reads OKSTATUS_AGENT_ID /
# OKSTATUS_AGENT_SECRET — 1.0.0 does. Legacy token mode also works.
appVersion: "1.0.0"
maintainers:
  - name: OKStatus
    url: https://okstatus.eu
keywords:
  - okstatus
  - monitoring
  - uptime
  - private-agent
