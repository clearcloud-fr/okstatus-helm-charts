{{- /* Only create a Secret from inline values when the user didn't point at
       an existing one (e.g. provisioned by External Secrets). */ -}}
{{- if and .Values.credentials.agentId (not .Values.credentials.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "private-agent.fullname" . }}-credentials
  labels:
    {{- include "private-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  agentId: {{ .Values.credentials.agentId | quote }}
  agentSecret: {{ .Values.credentials.agentSecret | quote }}
{{- end }}
{{- if .Values.token }}
{{- if .Values.credentials.agentId }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "private-agent.fullname" . }}-token
  labels:
    {{- include "private-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  OKSTATUS_TOKEN: {{ .Values.token | quote }}
{{- end }}
